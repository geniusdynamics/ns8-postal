#
# Restic backup of ns8-postal
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
# - settings.json: every setting (no secrets)
# - secrets/: 0600, secrets.env (Rails secret key, OIDC secret, SMTP and
#   rspamd passwords) and signing.key (the Postal signing key)
# - database.env: 0600, MariaDB passwords
# - postal.sql: dump of every Postal database (bin/module-dump-state)
#
# postal.yml and postal.env are rendered again by configure-module; the
# TLS certificate comes again from Traefik. The MariaDB files are not
# saved: the dump is consistent, the live files are not.
#
state/settings.json
state/secrets
state/database.env
state/postal.sql
